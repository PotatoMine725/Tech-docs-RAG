# EVAL-001 evaluation blueprints (design only: no final question wording, no generated answers).
# Design and field meanings: docs/specs/evaluation-dataset-design.md
# Mix (OD-4, owner 2026-09-24): 36 eval = 28 single-source + 4 cross-document + 4 corpus-insufficient;
# 18 en / 18 vi; 7 parallel EN/VI groups; plus 6 dev blueprints (split: dev).
# Ground truth comes only from corpus/sources (24 accepted docs). Quotes are verbatim (<= 300 chars).
# Parallel pairs share expected_sources, ground_truth and acceptance criteria through YAML anchors.
version: 1
created: 2026-09-24
status: proposed # the owner approves before EVAL-002 turns blueprints into questions
blueprints:

  # ---------------------------------------------------------------- PG-001 (#22, tiny)
  - id: BP-EVAL-001
    split: eval
    status: proposed
    language: en
    parallel_group_id: PG-001
    scope: single-source
    source_ids: ["22"]
    expected_sources: &pg001_src
      - source_id: "22"
        heading_path: "Querying Data"
    acceptable_alternate_sources: []
    objective: Recall whether EF Core skips the database when the requested entities are already loaded in the context.
    concepts: [EF Core, LINQ query, DbContext, query execution]
    cognitive_level: recall
    difficulty: easy
    size_class: tiny
    retrieval_target: The introduction of #22 (page H1 section, about 850 chars) stating that queries always run against the database.
    retrieval_challenges: [tiny_document, direct_semantic]
    evaluation_target:
      capability: Retrieve a fact from a tiny document that much larger documents could crowd out.
      failure_mode: tiny_doc_single_chunk
      why_it_matters: ADR-0003 lists tiny docs (#09, #22, #29) as a failure mode; #22 becomes one or two chunks in either arm.
      expected_behavior: A #22 chunk is in the top 5 and the answer says the query still goes to the database.
      rationale: Easy fact on a tiny document; paired with a VI case so the language effect is not mixed up with difficulty.
    ground_truth: &pg001_gt
      answer_points:
        - {id: P1, required: true, text: "No. EF Core always executes the query against the database, even if the entities returned by the query already exist in the context."}
        - {id: P2, required: false, text: "EF Core uses LINQ; it passes a representation of the LINQ query to the database provider, which translates it to a database-specific query language such as SQL."}
      evidence:
        - source_id: "22"
          heading_path: "Querying Data"
          quote: "Queries are always executed against the database even if the entities returned in the result already exist in the context."
        - source_id: "22"
          heading_path: "Querying Data"
          quote: "EF Core passes a representation of the LINQ query to the database provider. Database providers in turn translate it to database-specific query language (for example, SQL for a relational database)."
    answer_acceptance_criteria: &pg001_ans
      acceptable_variations:
        - "\"hits the database every time\" or \"doesn't return the tracked copy instead of querying\""
        - "\"DbContext\" used for \"context\""
      must_not_claim:
        - EF Core returns entities already in the context without querying the database.
        - Any EF Core API for changing tracking behavior (not in the corpus).
    citation_acceptance_criteria: &pg001_cit
      - Cites #22; the cited chunk contains the "always executed against the database" sentence.
      - Citation excerpt stays in English.
    question_notes: Ask whether EF Core skips the database when the entities are already loaded; don't reuse the words "always executed".
    reason_for_inclusion: Tiny-document coverage with an easy, unambiguous fact.

