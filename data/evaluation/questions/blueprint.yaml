  # ---------------------------------------------------------------- PG-006 (#29, tiny)
  - id: BP-EVAL-011
    split: eval
    status: proposed
    language: en
    parallel_group_id: PG-006
    scope: single-source
    source_ids: ["29"]
    expected_sources: &pg006_src
      - source_id: "29"
        heading_path: "ASP0033: `[ValidatableType]` is applied to an inaccessible type > Rule description"
      - source_id: "29"
        heading_path: "ASP0033: `[ValidatableType]` is applied to an inaccessible type > How to fix violations"
    acceptable_alternate_sources: &pg006_alt
      - source_id: "29"
        heading_path: "ASP0033: `[ValidatableType]` is applied to an inaccessible type > Cause"
        note: Supports P1.
    objective: Diagnose why validation is silently skipped for a file-local or private type marked [ValidatableType], and fix it.
    concepts: [ASP0033, ValidatableType, validation source generator, accessibility]
    cognitive_level: diagnose
    difficulty: medium
    size_class: tiny
    retrieval_target: "#29 'Rule description' and 'How to fix violations' (1.7K doc)."
    retrieval_challenges: [tiny_document, terminology_sensitive]
    evaluation_target:
      capability: Retrieve a tiny analyzer page against large ASP.NET Core pages with validation vocabulary.
      failure_mode: tiny_doc_single_chunk
      why_it_matters: Sections under 400 chars merge in Arm A (ADR-0003 D3); the whole page may be one chunk in either arm.
      expected_behavior: A #29 chunk is in the top 5; the answer gives the cause and the public/internal fix.
      rationale: Tiny doc with a precise, checkable answer.
    ground_truth: &pg006_gt
      answer_points:
        - {id: P1, required: true, text: "The validation source generator emits code in a separate file, so it can't access a type (or one of its containing types) that is private or file-local."}
        - {id: P2, required: true, text: "In that case the generator silently skips validation for the type (diagnostic ASP0033)."}
        - {id: P3, required: true, text: "Fix: make the attributed type and each of its containing types public or internal."}
        - {id: P4, required: false, text: "ASP0033 is a Usage rule with severity Warning."}
      evidence:
        - source_id: "29"
          heading_path: "ASP0033: `[ValidatableType]` is applied to an inaccessible type > Rule description"
          quote: "The validation source generator emits code in a separate file. A validatable type and all of its containing types must be public or internal and can't be file-local. Otherwise, the generator silently skips validation for the type."
        - source_id: "29"
          heading_path: "ASP0033: `[ValidatableType]` is applied to an inaccessible type > How to fix violations"
          quote: "Make the attributed type and each of its containing types public or internal."
    answer_acceptance_criteria: &pg006_ans
      acceptable_variations:
        - The fix may be shown as changing `file sealed class` to `internal sealed class`.
      must_not_claim:
        - The type must be public (internal is also allowed).
        - ASP0033 is a build error.
    citation_acceptance_criteria: &pg006_cit
      - The cited chunk contains the "silently skips validation" sentence and/or the public-or-internal fix.
    question_notes: Describe the symptom (validation doesn't run for a nested private model) without naming ASP0033.
    reason_for_inclusion: Tiny-doc diagnose case, both languages.

