  # ---------------------------------------------------------------- PG-003 (#02, table)
  - id: BP-EVAL-005
    split: eval
    status: proposed
    language: en
    parallel_group_id: PG-003
    scope: single-source
    source_ids: ["02"]
    expected_sources: &pg003_src
      - source_id: "02"
        heading_path: "Asynchronous programming scenarios > Recognize CPU-bound and I/O-bound scenarios"
    acceptable_alternate_sources: &pg003_alt
      - source_id: "02"
        heading_path: "Asynchronous programming scenarios > Explore the asynchronous programming model > CPU-bound example: Run game calculation"
        note: Partial support (Task.Run for CPU-bound work).
      - source_id: "02"
        heading_path: "Asynchronous programming scenarios > Explore the asynchronous programming model > I/O-bound example: Download data from web service"
        note: Partial support (await without Task.Run for I/O).
    objective: Choose the right async implementation for an I/O-bound task and for a CPU-bound task.
    concepts: [async, await, Task.Run, I/O-bound, CPU-bound, Task Parallel Library]
    cognitive_level: apply
    difficulty: medium
    size_class: medium
    retrieval_target: The decision table in #02 'Recognize CPU-bound and I/O-bound scenarios'.
    retrieval_challenges: [table, cross_source_overlap, paraphrase]
    evaluation_target:
      capability: Apply guidance that is stored as a Markdown table.
      failure_mode: fixed_size_code_split
      why_it_matters: The answer sits in table rows. Arm A keeps tables whole (ADR-0003 D4); a fixed-size window can cut rows away from the header.
      expected_behavior: The table chunk is retrieved and both rows are used.
      rationale: Table integrity is one place where the two chunkers behave differently; #01 overlaps the topic.
    ground_truth: &pg003_gt
      answer_points:
        - {id: P1, required: true, text: "I/O-bound work (waiting for data, e.g. from a database or web service): use async and await without Task.Run."}
        - {id: P2, required: true, text: "CPU-bound work (an expensive computation): use async and await, but run the work on another thread with Task.Run."}
        - {id: P3, required: false, text: "For work suited to concurrency and parallelism, also consider the Task Parallel Library."}
        - {id: P4, required: false, text: "Measure: CPU-bound work may not be costly enough to outweigh the overhead of context switches."}
      evidence:
        - source_id: "02"
          heading_path: "Asynchronous programming scenarios > Recognize CPU-bound and I/O-bound scenarios"
          quote: "Use the `async` modifier and `await` expression *without* the `Task.Run` method."
        - source_id: "02"
          heading_path: "Asynchronous programming scenarios > Recognize CPU-bound and I/O-bound scenarios"
          quote: "Use the `async` modifier and `await` expression, but spawn off the work on another thread with the `Task.Run` method."
        - source_id: "02"
          heading_path: "Asynchronous programming scenarios > Recognize CPU-bound and I/O-bound scenarios"
          quote: "Always measure the execution of your code."
    answer_acceptance_criteria: &pg003_ans
      acceptable_variations:
        - "\"offload to a background/thread-pool thread with Task.Run\""
      must_not_claim:
        - Use Task.Run for I/O-bound work.
        - Marking a CPU-bound method async (without Task.Run) moves the work off the calling thread.
    citation_acceptance_criteria: &pg003_cit
      - The cited chunk contains the table row(s) used for the claim (or the matching example section for a partial claim).
    question_notes: Describe two concrete tasks (download a file; compute something heavy) instead of naming "CPU-bound/I/O-bound".
    reason_for_inclusion: Apply-level case on table content, medium doc, both languages.

