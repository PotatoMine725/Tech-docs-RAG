  # ---------------------------------------------------------------- PG-005 (#03, specific heading)
  - id: BP-EVAL-009
    split: eval
    status: proposed
    language: en
    parallel_group_id: PG-005
    scope: single-source
    source_ids: ["03"]
    expected_sources: &pg005_src
      - source_id: "03"
        heading_path: "Unit testing best practices for .NET > Best practices > Avoid multiple Act tasks"
    acceptable_alternate_sources: []
    objective: Explain why a unit test should contain only one Act step.
    concepts: [unit testing, Arrange-Act-Assert, single Act, parameterized tests]
    cognitive_level: explain
    difficulty: easy
    size_class: medium
    retrieval_target: "#03 H3 'Avoid multiple Act tasks' under 'Best practices'."
    retrieval_challenges: [subsection_evidence, sibling_sections_share_vocabulary]
    evaluation_target:
      capability: Pick the right H3 among siblings that all talk about Arrange/Act/Assert.
      failure_mode: specific_heading
      why_it_matters: Sibling H3s ('Arrange your tests', 'Avoid coding logic in unit tests') and #17/#28 share the vocabulary.
      expected_behavior: The 'Avoid multiple Act tasks' chunk is ranked in the top 5.
      rationale: Header-aware chunks carry the exact H3 path; fixed-size chunks carry the nearest preceding heading.
    ground_truth: &pg005_gt
      answer_points:
        - {id: P1, required: true, text: "Include only one Act per test (for example a separate test per Act, or a parameterized test)."}
        - {id: P2, required: true, text: "With multiple Acts you can't guarantee that all Asserts execute: after one Assert fails, the rest of the test is treated as failing, which can make working functionality look broken."}
        - {id: P3, required: true, text: "At least one benefit of a single Act: you can see which Act fails, the test stays focused on one case, or you get a clear picture of why it fails."}
      evidence:
        - source_id: "03"
          heading_path: "Unit testing best practices for .NET > Best practices > Avoid multiple Act tasks"
          quote: "When you write your tests, try to include only one Act task per test."
        - source_id: "03"
          heading_path: "Unit testing best practices for .NET > Best practices > Avoid multiple Act tasks"
          quote: "Multiple Act tasks need to be individually asserted, and you can't guarantee that all Assert tasks execute."
    answer_acceptance_criteria: &pg005_ans
      acceptable_variations:
        - "\"one action/one behavior under test per test\""
      must_not_claim:
        - Multiple Acts are fine as long as each has its own Assert.
    citation_acceptance_criteria: &pg005_cit
      - The cited chunk is from 'Avoid multiple Act tasks' and contains the single-Act rule or the Assert-execution reason.
    question_notes: Present a test that calls the method twice with different inputs and asks what's wrong with it.
    reason_for_inclusion: Easy/explain parallel case with a heading-precision challenge.

