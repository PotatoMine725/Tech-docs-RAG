  # ---------------------------------------------------------------- PG-002 (#13, mixed versions)
  - id: BP-EVAL-003
    split: eval
    status: proposed
    language: en
    parallel_group_id: PG-002
    scope: single-source
    source_ids: ["13"]
    expected_sources: &pg002_src
      - source_id: "13"
        heading_path: "Handle errors in ASP.NET Core > Developer exception page"
    acceptable_alternate_sources: &pg002_alt
      - source_id: "13"
        heading_path: "Handle errors in ASP.NET Core > Developer Exception Page"
        note: Older variants; they support P2 and P3 but not P1.
      - source_id: "12"
        heading_path: "Handle errors in ASP.NET Core APIs > Developer Exception Page"
        note: Same default-on rule as #13 variants 1-5.
    objective: Explain when the developer exception page is on, where the page's version variants describe it differently.
    concepts: [developer exception page, Development environment, WebApplication.CreateBuilder, UseDeveloperExceptionPage]
    cognitive_level: explain
    difficulty: hard
    size_class: huge
    retrieval_target: "#13 'Developer exception page' (5 variants) and 'Developer Exception Page' (2 older variants); #12 has the same text."
    retrieval_challenges: [version_variants, near_duplicate_sections, cross_source_overlap]
    evaluation_target:
      capability: Give the current rule without mixing it with older template code.
      failure_mode: mixed_version
      why_it_matters: Variants 1-5 say the page is on by default (Development + WebApplication.CreateBuilder); the 2 older variants show templates calling UseDeveloperExceptionPage in Configure. Mixing them gives a wrong rule.
      expected_behavior: Answer states the default-on conditions, the earlier-template call, and "Development only".
      rationale: Shows whether each arm's top 5 is filled by old variants or by the variant with the current rule.
    ground_truth: &pg002_gt
      answer_points:
        - {id: P1, required: true, text: "It is enabled by default when both: the app runs in the Development environment, and the app was created with the current templates (WebApplication.CreateBuilder)."}
        - {id: P2, required: true, text: "Apps created with earlier templates (WebHost.CreateDefaultBuilder) enable it by calling app.UseDeveloperExceptionPage."}
        - {id: P3, required: true, text: "It should only be enabled in the Development environment; detailed exception information must not be shown publicly in production."}
        - {id: P4, required: false, text: "It can show the stack trace, query string parameters, cookies and headers."}
      evidence:
        - source_id: "13"
          heading_path: "Handle errors in ASP.NET Core > Developer exception page"
          quote: "ASP.NET Core apps enable the developer exception page by default when both:"
        - source_id: "13"
          heading_path: "Handle errors in ASP.NET Core > Developer exception page"
          quote: "Apps created using earlier templates, that is, by using [WebHost.CreateDefaultBuilder](/en-us/dotnet/api/microsoft.aspnetcore.webhost.createdefaultbuilder), can enable the developer exception page by calling"
        - source_id: "13"
          heading_path: "Handle errors in ASP.NET Core > Developer Exception Page"
          quote: "The preceding code enables the Developer Exception Page ***only*** when the app runs in the `Development` environment."
    answer_acceptance_criteria: &pg002_ans
      acceptable_variations:
        - "\"Development\" may be called the development environment or IsDevelopment()."
      must_not_claim:
        - It is on by default in every environment, or in production.
        - Every app must always call UseDeveloperExceptionPage (ignores the default for WebApplication.CreateBuilder apps).
        - Any specific ASP.NET Core version number for a variant (the page doesn't label its variants).
    citation_acceptance_criteria: &pg002_cit
      - P1 must be supported by a chunk containing "by default when both" (#13 variants 1-5 or #12).
      - A chunk from an older variant supports only P2/P3; citing only such chunks for P1 = correct_source_wrong_evidence.
    question_notes: Ask how/when the page gets turned on in a new vs an older app; don't mention versions.
    reason_for_inclusion: Main mixed-version case on the largest error-handling doc, in both languages.

