    reason_for_inclusion: Parallel EN/VI group on a medium case.

  # ---------------------------------------------------------------- PG-004 (#23, repeated sections)
  - id: BP-EVAL-007
    split: eval
    status: proposed
    language: en
    parallel_group_id: PG-004
    scope: single-source
    source_ids: ["23"]
    expected_sources: &pg004_src
      - source_id: "23"
        heading_path: "Routing in ASP.NET Core > Route constraints"
    acceptable_alternate_sources: &pg004_alt
      - source_id: "23"
        heading_path: "Routing in ASP.NET Core > Route constraint reference"
        note: Older variant with the same warning.
    objective: Diagnose why invalid input returns 404 when route constraints are used to validate it.
    concepts: [route constraints, input validation, 404 Not Found, 400 Bad Request]
    cognitive_level: diagnose
    difficulty: medium
    size_class: huge
    retrieval_target: The warning near the start of #23 'Route constraints' (4.7K section, 3 copies + 1 older copy).
    retrieval_challenges: [version_variants, long_section, subsection_evidence]
    evaluation_target:
      capability: Find a short warning inside a long, repeated section of the largest document.
      failure_mode: repeated_version_sections
      why_it_matters: Four copies of the section and its long constraint table compete for the top 5.
      expected_behavior: A chunk containing the warning is retrieved; the answer explains 404 vs 400 and the intended use.
      rationale: The warning sits in the first part of a section that both arms must split.
    ground_truth: &pg004_gt
      answer_points:
        - {id: P1, required: true, text: "Route constraints shouldn't be used for input validation."}
        - {id: P2, required: true, text: "If they are, invalid input produces 404 Not Found; invalid input should instead produce 400 Bad Request with an appropriate error message."}
        - {id: P3, required: true, text: "Route constraints are meant to disambiguate similar routes."}
        - {id: P4, required: false, text: "Constraints run after the URL matched and was tokenized into route values; they make a true/false decision about a route value."}
      evidence:
        - source_id: "23"
          heading_path: "Routing in ASP.NET Core > Route constraints"
          quote: "Don't use constraints for input validation. If constraints are used for input validation, invalid input results in a `404` Not Found response."
        - source_id: "23"
          heading_path: "Routing in ASP.NET Core > Route constraints"
          quote: "Invalid input should produce a `400` Bad Request with an appropriate error message. Route constraints are used to disambiguate similar routes, not to validate the inputs for a particular route."
    answer_acceptance_criteria: &pg004_ans
      acceptable_variations:
        - "\"used to tell similar routes apart\" for disambiguation"
      must_not_claim:
        - Route constraints return 400 Bad Request for invalid values.
        - Constraints such as {id:int} are the recommended way to validate input.
    citation_acceptance_criteria: &pg004_cit
      - The cited chunk contains the "Don't use constraints for input validation" warning (any variant).
    question_notes: Describe the symptom (an API returns 404 for a malformed id) and ask why and what to do.
    reason_for_inclusion: Diagnose-level case on the largest document, both languages.

