# EVAL-001 evidence map: why each "not in the documents" case is really unanswerable,
# and which corpus sections are known distractors for the blueprints.
# Search scope for every proof: corpus/sources/*.md (the 24 accepted documents only;
# excluded documents 14, 19, 24, 27 are never searched or used; #25 never existed).
# Method: case-insensitive fixed-string search, e.g.  grep -i -F -l -e "<term>" corpus/sources/*.md
# Results were produced on 2026-09-24; tests/unit/test_evaluation_blueprints.py re-runs every search.
version: 1
created: 2026-09-24

absence_proofs:
  - id: ABS-001
    blueprint: BP-EVAL-033
    topic: EF Core queries without change tracking
    zero_hit_terms: [AsNoTracking, no-tracking, NoTracking, change tracking, QueryTrackingBehavior]
    result: 0 hits for every term in the 24 accepted documents.
    closest_corpus_text: "#22 'Querying Data' covers LINQ queries and says queries always hit the database; nothing about turning tracking off."
    substring_notes: "The bare word 'track' matches unrelated text only: #02 (compiler state machine) and #13 (a datatracker.ietf.org URL)."

  - id: ABS-002
    blueprint: BP-EVAL-034
    topic: Rate limiting in ASP.NET Core
    zero_hit_terms: [rate limit, ratelimit, RateLimiter, RequireRateLimiting, AddRateLimiter]
    result: 0 hits for every term in the 24 accepted documents.
    closest_corpus_text: "Middleware activation (#11), routing and short-circuiting (#23), DI (#10)."
    substring_notes: "'limiter' alone matches only 'delimiter' in #23."

  - id: ABS-003
    blueprint: BP-EVAL-035
    topic: What ASP.NET Core scope validation checks
    zero_hit_terms: [ValidateScopes, root provider, root service provider]
    allowed_hits:
      - term: scope validation
        source_id: "10"
        heading_path: "Dependency injection in ASP.NET Core > Scope validation"
        note: The only occurrences (4) are the heading, one sentence and two link texts in this section.
    section_text: |
      ## Scope validation

      For guidance on scope validation, see the following resources:

      - [.NET dependency injection: Scope validation](/en-us/dotnet/core/extensions/dependency-injection/overview#scope-validation)
      - [ASP.NET Core Web Host: Scope validation](host/web-host?view=aspnetcore-10.0#scope-validation)
    result: The corpus names the topic but holds no content about it (links only).

  - id: ABS-004
    blueprint: BP-EVAL-036
    topic: Verifying calls with the Moq library
    zero_hit_terms: [Moq, NSubstitute, Times.Once, "Verify(", mocking framework, call count]
    allowed_hits:
      - term: "Mock<"
        source_id: "03"
        heading_path: "Unit testing best practices for .NET > Best practices > Handle stub static references with seams"
        note: "Creating a mock object: `new Mock<IDateTimeProvider>()` (2 occurrences, both in this section)."
      - term: ".Setup("
        source_id: "03"
        heading_path: "Unit testing best practices for .NET > Best practices > Handle stub static references with seams"
        note: "Stubbing a return value: `.Setup(dtp => dtp.DayOfWeek()).Returns(DayOfWeek.Monday)`."
    result: 0 hits for every zero-hit term. The corpus shows creating a mock and stubbing a return value, never verifying how often a method was called.
    closest_corpus_text: "#03 'Unit testing terminology' defines fake, mock and stub with hand-written classes; #03 'Handle stub static references with seams' uses `new Mock<T>()` and `.Setup(...).Returns(...)` without naming the library and without any call verification."

  - id: ABS-005
    blueprint: BP-DEV-005
    topic: JWT refresh tokens
    zero_hit_terms: [refresh token, RefreshToken, refresh_token]
    result: 0 hits for every term in the 24 accepted documents.
    closest_corpus_text: "#15 shows JWT bearer setup and token generation only."

  - id: ABS-006
    blueprint: BP-DEV-006
    topic: Web API versioning
    zero_hit_terms: [API versioning, ApiVersion, Asp.Versioning, api-version]
    result: 0 hits for every term in the 24 accepted documents.
    closest_corpus_text: "#12 (API error handling) and #23 (routing)."

