    - {id: P2, text: "Không tự dispose service được resolve từ container.", required: true}
  expected_sources: [{source_id: "10", heading_path: "Dependency injection in ASP.NET Core > Design services for dependency injection > Disposal of services", slot: S1}]
  evidence:
    - {source_id: "10", heading_path: "Dependency injection in ASP.NET Core > Design services for dependency injection > Disposal of services", supports: [P1], quote: "The container calls [Dispose](/en-us/dotnet/api/system.idisposable.dispose) for the [IDisposable](/en-us/dotnet/api/system.idisposable) types it creates."}
    - {source_id: "10", heading_path: "Dependency injection in ASP.NET Core > Design services for dependency injection > Disposal of services", supports: [P2], quote: "Services resolved from the container should never be disposed by the developer."}
  must_not_claim: ["The developer must call Dispose on resolved services.", "Singletons are never disposed by the container."]
  cognitive_level: explain
  difficulty: medium
  size_class: medium
  concepts: [IDisposable, service disposal, dependency injection]

