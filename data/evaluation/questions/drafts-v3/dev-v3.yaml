    - {source_id: "03", heading_path: "Unit testing best practices for .NET > Best practices > Avoid magic strings", supports: [P2], quote: "Rather than using magic strings, assign any hard-coded values to constants."}
  must_not_claim: ["Move the values into a configuration file or a database.", "Literal values only matter for performance."]
  cognitive_level: explain
  difficulty: medium
  size_class: medium
  retrieval_challenges: [B_en_on_en, paraphrase]
