    - {source_id: "26", heading_path: "The C# type system > Compile-time type and run-time type", supports: [P1], quote: "In the preceding example, `boxed` has a compile-time type of `object` but a run-time type of `string`."}
    - {source_id: "26", heading_path: "The C# type system > Compile-time type and run-time type", supports: [P2, P3], quote: "The compile-time type controls overload resolution and available conversions. The run-time type controls virtual method dispatch, `is` expressions, and `switch` expressions."}
