# Benchmark v2 blueprint: ALLOCATION ONLY (step 2). Owner approves the counts before any question is written.
# Design: docs/architecture/decisions/0008-corpus-2-study-material.md; plan Phase 0 item 3.
# v1 files and the eval-freeze-v1 tag are never edited; v2 is additive (v1 36 eval + v2 = >= 100 eval questions).
# Ground truth comes only from corpus2/converted (C2-*) or corpus 1 sources; quotes are verbatim (<= 300 chars), prose only.
# typing: "diacritics" (normal Vietnamese) | "no_diacritics" (Vietnamese typed without tone/shape marks) | "en".
# Every slot becomes one DRAFT question in step 3; per-slot objectives, sources and heading paths are filled then.
version: 2
created: 2026-11-25
status: proposed  # allocation; owner OK required before step 3
categories:
  A_vi_on_vi:      {question_language: vi, corpus: corpus2, docs_language: vi}
  B_en_on_en:      {question_language: en, corpus: corpus2, docs_language: en}
  C_vi_on_en:      {question_language: vi, corpus: corpus2, docs_language: en}
  D_vi_on_mixed:   {question_language: vi, corpus: corpus2, docs_language: mixed}
  E_identifier_c1: {question_language: [en, vi], corpus: corpus1, note: exact class / method / option / error names}
  F_unanswerable:  {question_language: [en, vi], corpus: [corpus1, corpus2], note: topic near the corpus, not answered by it}
