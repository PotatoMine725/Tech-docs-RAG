  category: D_vi_on_mixed
  corpus: corpus2
  language: vi
  question: "Một JSON Web Token gồm những phần nào, và tại sao không nên để thông tin nhạy cảm trong payload?"
  answerable: true
  expected_answer: "JWT gồm Header (thuật toán ký, ví dụ HS256, RS256), Payload (dữ liệu/claims như userId, role, expiration time) và Signature (tạo từ Header + Payload + secret key). Không lưu thông tin nhạy cảm trong payload vì ai cũng có thể decode."
  answer_points:
    - {id: P1, text: "Ba phần: Header, Payload, Signature.", required: true}
    - {id: P2, text: "Payload ai cũng decode được nên không chứa thông tin nhạy cảm.", required: true}
  expected_sources: [{source_id: C2-05, heading_path: "", slot: S1}]
  evidence:
    - {source_id: C2-05, heading_path: "", supports: [P1], quote: "Header: Chứa thông tin thuật toán ký (HS256, RS256, v.v.)"}
    - {source_id: C2-05, heading_path: "", supports: [P1], quote: "Payload: Chứa dữ liệu (claims) — như userId, role, expiration time."}
    - {source_id: C2-05, heading_path: "", supports: [P1], quote: "Signature: Được tạo từ Header + Payload + secret key"}
    - {source_id: C2-05, heading_path: "", supports: [P2], quote: "Không lưu thông tin nhạy cảm trong payload (vì ai cũng có thể decode)."}
  must_not_claim: ["The payload is encrypted, so secrets are safe in it."]
  cognitive_level: explain
  difficulty: medium
  concepts: [JWT, payload, signature]

