- id: Q2-EVAL-040
  split: eval
  category: B_en_on_en
  corpus: corpus2
  language: en
  typing: en
  question: "A trainee's learning path in FA Management has 45 learning days. What Committed Working Duration will the system set, and how is it worked out?"
  answerable: true
  expected_answer: "Training Duration = number of learning days / 30, rounded up to the unit digit: 45 / 30 = 1.5, rounded up to 2 months. Because 1 month < Training Duration <= 2 months, the Committed Working Duration is set to 6 months."
  answer_points:
    - {id: P1, text: "Training Duration is the number of learning days divided by 30, rounded up (45 / 30 = 1.5, so 2 months).", required: true}
    - {id: P2, text: "A Training Duration over 1 month and up to 2 months gives a Committed Working Duration of 6 months.", required: true}
  expected_sources: [{source_id: C2-13, heading_path: "Use Case Specifications > Trainee Management > UC 33: Calculate Committed Working Duration", slot: S1}]
  evidence:
    - {source_id: C2-13, heading_path: "Use Case Specifications > Trainee Management > UC 33: Calculate Committed Working Duration", supports: [P1], quote: "Calculate Training Duration as the following formula (round up to unit digit): *Number of learning days / 30"}
    - {source_id: C2-13, heading_path: "Use Case Specifications > Trainee Management > UC 33: Calculate Committed Working Duration", supports: [P2], quote: "If 1 month < Training Duration ≤ 2 months, set the value of [Committed Working Duration] as “6 months”."}
  must_not_claim: ["The Committed Working Duration is 4 months or 12 months.", "Training Duration is computed by dividing the learning days by 20 or by 7."]
  cognitive_level: apply
  difficulty: hard
  concepts: [business rule, committed working duration, training duration]

