  question: "How can international migration benefit both the countries that receive migrants and the countries they come from?"
  answerable: true
  expected_answer: "In receiving countries, migrants can fill labor shortages in certain industries. In sending countries, migration can ease unemployment and other social pressures and increases financial inflows through remittances that migrants send to their families back home."
  answer_points:
    - {id: P1, text: "Receiving countries: migrants fill labor shortages in certain industries.", required: true}
    - {id: P2, text: "Sending countries: migration eases unemployment and social pressures.", required: true}
    - {id: P3, text: "Sending countries gain financial inflows as remittances to migrants' families.", required: true}
  expected_sources: [{source_id: C2-18, heading_path: "", slot: S1}]
  evidence:
    - {source_id: C2-18, heading_path: "", supports: [P1], quote: "In the receiving countries, migrants can ﬁll labor shortages in certain industries."}
    - {source_id: C2-18, heading_path: "", supports: [P2, P3], quote: "In the sending countries, they can help ease unemployment and other social pressures while increasing ﬁnancial inﬂows, in the form of remittances from the migrants to their families back home."}
  must_not_claim: ["Migration only benefits the receiving countries.", "Remittances flow from the home country to the migrants."]
  cognitive_level: explain
  difficulty: medium
  concepts: [international migration, remittances]

- id: Q2-EVAL-045
  split: eval
  category: B_en_on_en
  corpus: corpus2
  language: en
  typing: en
  question: "I'm making a Unity game with 3D models but an orthographic bird's-eye camera. Should I start the editor in 2D or 3D mode?"
  answerable: true
  expected_answer: "Start in 3D mode. Games that use 3D geometry with an orthographic camera (sometimes called 2.5D) should still use the editor in 3D mode because, even without perspective, you are working with 3D models and assets; you just switch the camera and scene view to Orthographic."
  answer_points:
    - {id: P1, text: "Use 3D mode.", required: true}
    - {id: P2, text: "Reason: even without perspective you are still working with 3D models and assets.", required: true}
    - {id: P3, text: "This orthographic bird's-eye style is a common technique sometimes called 2.5D.", required: false}
  expected_sources: [{source_id: C2-19, heading_path: "", slot: S1}]
  evidence:
    - {source_id: C2-19, heading_path: "", supports: [P1, P2], quote: "If you’re making a game like this, you should also use the editor in3Dmode, because even though there is noperspective, you will still be working with 3D models and assets."}
    - {source_id: C2-19, heading_path: "", supports: [P3], quote: "Sometimes games use 3D geometry, but use an orthographic camera instead of perspective. This is a common technique used in games which give you a bird’s-eye view of the action"}
  must_not_claim: ["An orthographic camera means you must start in 2D mode.", "The mode can never be changed after the project is created."]
  cognitive_level: apply
  difficulty: easy
  concepts: [Unity, 2D vs 3D mode, orthographic camera]

- id: Q2-EVAL-046
  split: eval
  category: B_en_on_en
  corpus: corpus2
  language: en
  typing: en
  question: "In Unity, how does Start differ from Awake in terms of which script instances it runs on and when it is called?"
  answerable: true
  expected_answer: "Start is similar to Awake, but unlike Awake it only runs on active instances (a script that starts disabled gets Start only when it is later enabled), and all Start methods are called only after every Awake method has run, which makes it easy to control initialization order."
  answer_points:
    - {id: P1, text: "Start is only carried out on active (enabled) script instances, unlike Awake.", required: true}
    - {id: P2, text: "Start methods are called only after all Awake methods have executed.", required: true}
  expected_sources: [{source_id: C2-19, heading_path: "", slot: S1}]
  evidence:
    - {source_id: C2-19, heading_path: "", supports: [P1], quote: "However, unlike Awake , this method is only carried out on active instances."}
    - {source_id: C2-19, heading_path: "", supports: [P2], quote: "In addition, the Start methods are only called after all Awake methods have been executed"}
  must_not_claim: ["Start runs before Awake.", "Start is called every frame."]
  cognitive_level: compare
  difficulty: hard
  concepts: [Unity, MonoBehaviour, Awake, Start]

- id: Q2-EVAL-047
  split: eval
  category: B_en_on_en
  corpus: corpus2
  language: en
  typing: en
  question: "My Unity coroutine waits with WaitForSeconds, but very short waits are never timed more precisely than one frame. Why does that happen?"
  answerable: true
  expected_answer: "An interruption with WaitForSeconds can only be as precise as the frame duration, so if each frame lasts 0.02 seconds the wait cannot be more accurate than that."
  answer_points:
    - {id: P1, text: "WaitForSeconds can only be as precise as the frame duration.", required: true}
    - {id: P2, text: "Example: with 0.02-second frames, the accuracy cannot be better than 0.02 seconds.", required: false}
  expected_sources: [{source_id: C2-19, heading_path: "", slot: S1}]
  evidence:
    - {source_id: C2-19, heading_path: "", supports: [P1, P2], quote: "Please note that an interruption with WaitForSeconds can only be as precise as the frame duration. So if every frame lasts 0.02 seconds, the accuracy of WaitForSeconds cannot be better."}
  must_not_claim: ["WaitForSeconds is accurate to the millisecond regardless of frame rate.", "The imprecision is caused by a bug in the float parameter."]
  cognitive_level: diagnose
  difficulty: medium
  concepts: [Unity, coroutine, WaitForSeconds, frame duration]

