- id: Q2-EVAL-037
  split: eval
  category: B_en_on_en
  corpus: corpus2
  language: en
  typing: en
  question: "In the IELTS essay about profit-making healthcare, what did private clinics do during COVID-19, and which healthcare model does the writer finally recommend?"
  answerable: true
  expected_answer: "During the COVID-19 pandemic private clinics helped expand testing capacity and supported vaccination efforts; in the conclusion the writer recommends a public-private healthcare model as the most practical and effective approach for most nations."
  answer_points:
    - {id: P1, text: "Private clinics played a crucial role in expanding testing capacity and supporting vaccination during COVID-19.", required: true}
    - {id: P2, text: "The writer recommends a public-private healthcare model as the most practical and effective approach for most nations.", required: true}
  expected_sources: [{source_id: C2-01, heading_path: "Some people think that good health is very important to every person, so medical services should not be run by profit-making companies. Do the advantages outweigh the disadvantages?", slot: S1}]
  evidence:
    - {source_id: C2-01, heading_path: "Some people think that good health is very important to every person, so medical services should not be run by profit-making companies. Do the advantages outweigh the disadvantages?", supports: [P1], quote: "During the COVID-19 pandemic, private clinics played a crucial role in expanding testing capacity and supporting vaccination efforts"}
    - {source_id: C2-01, heading_path: "Some people think that good health is very important to every person, so medical services should not be run by profit-making companies. Do the advantages outweigh the disadvantages?", supports: [P2], quote: "In my opinion, a public-private healthcare model would be the most practical and effective approach for most nations."}
  must_not_claim: ["The writer recommends a fully private healthcare system.", "The writer recommends a fully public healthcare system with no private providers."]
  cognitive_level: recall
  difficulty: medium
  concepts: [private healthcare, COVID-19, public-private model]

