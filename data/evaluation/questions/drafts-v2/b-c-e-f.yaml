- id: Q2-EVAL-042
  split: eval
  category: B_en_on_en
  corpus: corpus2
  language: en
  typing: en
  question: "What common features does the World Bank's introduction to global issues say every global issue shares?"
  answerable: true
  expected_answer: "Each global issue affects many people on different sides of national borders; it is a significant concern to all or most countries (often shown by a major U.N. declaration or a global conference); and it needs a global regulatory approach because no single government can impose a solution and market forces alone will not solve it."
  answer_points:
    - {id: P1, text: "It affects a large number of people on different sides of national boundaries.", required: true}
    - {id: P2, text: "It is a significant concern to all or most countries, often evidenced by a major U.N. declaration or a global conference.", required: true}
    - {id: P3, text: "It requires a global regulatory approach: no one government can impose a solution and market forces alone will not solve it.", required: true}
  expected_sources: [{source_id: C2-18, heading_path: "", slot: S1}]
  evidence:
    - {source_id: C2-18, heading_path: "", supports: [P1], quote: "Each issue affects a large number of people on different sides of national boundaries."}
    - {source_id: C2-18, heading_path: "", supports: [P2], quote: "Each issue is one of signiﬁcant concern, directly or indirectly, to all or most of the countries of the world, often as evidenced by a major U.N. declaration or the holding of a global conference on the issue."}
    - {source_id: C2-18, heading_path: "", supports: [P3], quote: "Each issue has implications that require a global regulatory approach; no one government has the power or the authority to impose a solu- tion, and market forces alone will not solve the problem."}
  must_not_claim: ["Market forces alone can solve a global issue.", "A global issue only affects developing countries."]
  cognitive_level: recall
  difficulty: medium
  concepts: [global issues, definition]

